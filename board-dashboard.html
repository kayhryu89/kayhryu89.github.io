<head>

  <title>LASER Research Dashboard</title>
  <style>
    :root {

      --paper: #fbfcfa;

      --accent-soft: #d7eee7;
      --blue: #1c5f89;

      --amber: #a86800;

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-size: 14px; line-height: 1.45; }
    button, input { font: inherit; }
    button { color: inherit; }
    .topbar { background: var(--ink); color: #fff; padding: 20px clamp(18px, 4vw, 64px); display: flex; align-items: end; justify-content: space-between; gap: 20px; }
    .brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .brand-mark { width: 32px; height: 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .brand-mark span { background: #75c6b5; }
    .brand-mark span:nth-child(2), .brand-mark span:nth-child(4), .brand-mark span:nth-child(6) { background: #e7b655; }
    .brand h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: 0; }
    .brand p, .generated { margin: 2px 0 0; color: #c6d4cf; font-size: 12px; }
    .generated { text-align: right; white-space: nowrap; }
    main { max-width: 1480px; margin: 0 auto; padding: 24px clamp(18px, 4vw, 64px) 48px; }
    .summary-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
    .summary-group-title { margin: 0 0 8px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .metric { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-height: 92px; }
    .metric .value { font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
    .metric .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    .metric.accent .value { color: var(--accent); }
    .metric.blue .value { color: var(--blue); }
    .metric.amber .value { color: var(--amber); }
    .metric.coral .value { color: var(--coral); }
    .view-tabs { display: flex; gap: 22px; margin-top: 28px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .tab-button { background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 10px 2px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .tab-button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); }
    .view { display: none; padding-top: 20px; }
    .view.active { display: block; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
    .section-head h2 { margin: 0; font-size: 16px; }
    .section-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .surface { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
    .surface + .surface, .split-grid + .surface, .surface + .split-grid { margin-top: 16px; }
    .split-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr); gap: 16px; }

    .surface-header h2, .surface-header h3 { margin: 0; font-size: 15px; }

    .pipeline { padding: 18px 16px; display: grid; grid-template-columns: repeat(6, minmax(78px, 1fr)); gap: 10px; }
    .pipeline-step { min-width: 0; border-left: 3px solid var(--line); padding-left: 10px; }

    .signal.warning { background: var(--amber); }
    .item-title { font-weight: 650; color: var(--ink); text-decoration: none; }
    .item-title:hover { text-decoration: underline; }
    .item-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .status-parked, .status-unknown { color: var(--slate); background: #e8eceb; }
    .status-published { color: var(--coral); background: var(--coral-soft); }
    .stage { display: inline-flex; align-items: center; border: 1px solid currentColor; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 650; white-space: nowrap; }
    .stage-project { color: var(--blue); background: var(--blue-soft); }
    .stage-incubation { color: var(--amber); background: var(--amber-soft); }
    .badge-stack { display: flex; justify-content: flex-end; align-items: center; gap: 5px; flex-wrap: wrap; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .filter-groups { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: 7px; }
    .filter-label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .segments { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
    .segment { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 7px 10px; cursor: pointer; font-size: 12px; }
    .segment:last-child { border-right: 0; }
    .segment.active { background: var(--ink); color: #fff; }
    .search { position: relative; min-width: min(100%, 300px); }
    .search input { width: 100%; border: 1px solid var(--line); border-radius: 5px; background: #fff; padding: 8px 10px 8px 30px; color: var(--ink); }
    .search:before { content: "⌕"; position: absolute; left: 10px; top: 5px; color: var(--muted); font-size: 17px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 820px; border-collapse: collapse; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }

    td { font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    .table-title { font-weight: 650; color: var(--ink); text-decoration: none; }
    .table-title:hover { text-decoration: underline; }
    .small { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); padding: 28px 16px; text-align: center; }
    .attention-item { grid-template-columns: 10px 1fr; }
    .attention-kind { color: var(--amber); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
    .attention-message { color: var(--muted); font-size: 13px; }
    .footer { color: var(--muted); font-size: 12px; padding-top: 18px; }

EADME.md", "kind": "Project"}]}, {"name": "Yujin Cheon (GNU)", "workstreams": [{"title": "Batch-process identification under repetitive and deterministic disturbances using differenced batch data", "path_uri": "file:///E:/02_Researches/03_Projects/2604_BatchIDwDisturbance/README.md", "kind": "Project"}, {"title": "Faster and More Consistent Response-Guided Process-Descriptor Trial Retuning for Rule-Based PID Control", "path_uri": "file:///E:/02_Researches/03_Projects/2607_SOPTD_Descriptor_Tuning/README.md", "kind": "Project"}]}], "attention": [{"title": "Energy recovery from pressure regulation station", "message": "Review date passed on 2026-07-30.", "path_uri": "file:///E:/02_Researches/03_Projects/2607_prs_heatp/README.md", "kind": "Review date"}], "status_labels": {"inbox": "Inbox", "seed": "Seed", "candidate": "Candidate", "active": "Active", "exploring": "Exploring", "submitted": "Submitted", "under_review": "Under review", "under_revision": "Under revision", "published": "Published", "parked": "Parked", "promoted": "Promoted", "unknown": "Not recorded"}, "stage_labels": {"incubation": "Incubation", "project": "Project"}}</script>
  <script>
    const data = JSON.parse(document.getElementById('dashboard-data').textContent);
    const statusLabels = data.status_labels;
    const stageLabels = data.stage_labels;
    let stageFilter = 'all';
    let statusFilter = 'all';
    let searchTerm = '';

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const labelFor = (status) => statusLabels[status] || 'Not recorded';
    const badge = (status) => `<span class="status status-${escapeHtml(status)}">${escapeHtml(labelFor(status))}</span>`;
    const stageFor = (stage) => stageLabels[stage] || 'Not recorded';
    const stageBadge = (stage) => `<span class="stage stage-${escapeHtml(stage)}">${escapeHtml(stageFor(stage))}</span>`;
    const dateOrMissing = (value) => value ? escapeHtml(value) : '<span class="small">Not recorded</span>';
    const fileLink = (item, titleClass = 'table-title') => `<a class="${titleClass}" href="${escapeHtml(item.path_uri)}" target="_blank" rel="noreferrer">${escapeHtml(item.title)}</a>`;
    const stageRank = { project: 0, incubation: 1 };
    const statusRank = { under_revision: 0, under_review: 1, submitted: 2, active: 3, exploring: 4, candidate: 5, parked: 6, published: 7, unknown: 8 };
    const publicationRank = (item) => {
      if (item.stage !== 'project') return 0;
      if (item.status === 'under_revision') return 0;
      if (item.status === 'under_review') return 1;
      if (item.status === 'submitted' || item.submitted) return 2;
      return 3;
    };
    const compareProjects = (a, b) => {
      const stageDifference = (stageRank[a.stage] ?? 9) - (stageRank[b.stage] ?? 9);
      if (stageDifference) return stageDifference;
      const publicationDifference = publicationRank(a) - publicationRank(b);
      if (publicationDifference) return publicationDifference;
      const statusDifference = (statusRank[a.status] ?? 9) - (statusRank[b.status] ?? 9);
      if (statusDifference) return statusDifference;
      return String(a.title || '').localeCompare(String(b.title || ''));
    };

    function renderMetrics() {
      const underReview = data.projects.filter((item) => item.status === 'under_review').length;
      const activeWork = data.projects.filter((item) => ['active', 'under_revision'].includes(item.status)).length;
      const portfolio = [
        ['Ideas', data.ideas.length, 'accent'],
        ['Incubation', data.projects.filter((item) => item.stage === 'incubation').length, 'amber'],
        ['Projects', data.projects.filter((item) => item.stage === 'project').length, 'blue'],
      ];
      const operations = [
        ['Active work', activeWork, 'accent'],
        ['Under review', underReview, 'blue'],
        ['Follow-up', data.attention.length, 'coral'],
      ];
      const group = (title, metrics) => `<div><h2 class="summary-group-title">${title}</h2><div class="metric-grid">${metrics.map(([label, value, color]) => `<div class="metric ${color}"><div class="value">${value}</div><div class="label">${label}</div></div>`).join('')}</div></div>`;
      document.getElementById('metrics').innerHTML = group('Research portfolio', portfolio) + group('Operating status', operations);
    }

    function pipelineStep(status) {
      const count = data.ideas.filter((item) => item.status === status).length;
      return `<div class="pipeline-step"><div class="count">${count}</div><div class="name">${escapeHtml(labelFor(status))}</div></div>`;
    }

    function renderOverview() {
      const focus = [...data.projects].sort(compareProjects);
      const focusMarkup = focus.length ? focus.map((item) => `
        <li class="focus-item"><span class="signal ${item.status === 'under_review' ? 'warning' : ''}"></span>
          <div>${fileLink(item, 'item-title')}<div class="item-meta">${escapeHtml(stageFor(item.stage))} · ${escapeHtml(item.journal || item.output || 'No output recorded')}${item.submitted ? ` · submitted ${escapeHtml(item.submitted)}` : ''}</div></div>
          <div class="badge-stack">${stageBadge(item.stage)}${badge(item.status)}</div>
        </li>`).join('') : '<li class="empty">No project records found.</li>';
      const attentionMarkup = data.attention.slice(0, 5).map((item) => `
        <li class="attention-item"><span class="signal warning"></span><div><div class="attention-kind">${escapeHtml(item.kind)}</div><a class="item-title" href="${escapeHtml(item.path_uri)}" target="_blank" rel="noreferrer">${escapeHtml(item.title)}</a><div class="attention-message">${escapeHtml(item.message)}</div></div></li>`).join('') || '<li class="empty">No metadata follow-up is currently flagged.</li>';
      document.getElementById('overview').innerHTML = `
        <div class="surface"><div class="surface-header"><h2>Idea Pipeline</h2><span class="subtle">Current idea states</span></div><div class="pipeline">${['inbox','seed','candidate','active','parked','promoted'].map(pipelineStep).join('')}</div></div>
        <div class="split-grid">
          <div class="surface"><div class="surface-header"><h2>Current Workstreams</h2><span class="subtle">Stage and current status</span></div><ul class="focus-list">${focusMarkup}</ul></div>
          <div class="surface"><div class="surface-header"><h2>Attention Needed</h2><span class="subtle">Actionable follow-up only</span></div><ul class="attention-list">${attentionMarkup}</ul></div>
        </div>`;
    }

    function filteredProjects() {
      return data.projects.filter((item) => {
        const matchesStage = stageFilter === 'all' || item.stage === stageFilter;
        const matchesStatus = statusFilter === 'all' || item.status === statusFilter;
        const haystack = [item.title, item.stage, item.status, item.journal, item.output, (item.coworkers || []).join(' ')].join(' ').toLowerCase();
        return matchesStage && matchesStatus && haystack.includes(searchTerm.toLowerCase());
      }).sort(compareProjects);
    }

    function projectRows(items) {
      return items.length ? items.map((item) => `<tr>
        <td>${fileLink(item)}<div class="small">${escapeHtml(item.id)}</div></td>
        <td>${stageBadge(item.stage)}</td>
        <td>${badge(item.status)}</td>
        <td>${escapeHtml(item.journal || item.output || 'Not recorded')}</td>
        <td>${dateOrMissing(item.last_activity)}</td>
        <td>${item.next_action ? escapeHtml(item.next_action) : '<span class="small">Not recorded</span>'}</td>
      </tr>`).join('') : '<tr><td colspan="6" class="empty">No workstreams match these filters.</td></tr>';
    }

    function renderProjects() {
      const stageOptions = [['all', 'All stages'], ['project', 'Projects'], ['incubation', 'Incubation']];
      const statusOptions = [['all', 'All states'], ['active', 'Active'], ['under_review', 'Under review'], ['under_revision', 'Under revision'], ['exploring', 'Exploring']];
      document.getElementById('projects').innerHTML = `
        <div class="surface"><div class="surface-header"><h2>Workstreams</h2><span class="subtle">Folder stage and README status</span></div>
          <div class="controls"><div class="filter-groups"><div class="filter-group"><span class="filter-label">Stage</span><div class="segments" aria-label="Filter by stage">${stageOptions.map(([key, label]) => `<button class="segment ${stageFilter === key ? 'active' : ''}" data-stage-filter="${key}" type="button">${label}</button>`).join('')}</div></div><div class="filter-group"><span class="filter-label">Status</span><div class="segments" aria-label="Filter by current status">${statusOptions.map(([key, label]) => `<button class="segment ${statusFilter === key ? 'active' : ''}" data-status-filter="${key}" type="button">${label}</button>`).join('')}</div></div></div><label class="search"><input type="search" id="project-search" value="${escapeHtml(searchTerm)}" placeholder="Search workstreams" aria-label="Search workstreams"></label></div>
          <div class="table-wrap"><table><thead><tr><th>Workstream</th><th>Stage</th><th>Current status</th><th>Journal / output</th><th>Last activity</th><th>Next action</th></tr></thead><tbody id="project-rows">${projectRows(filteredProjects())}</tbody></table></div>
        </div>`;
      document.querySelectorAll('[data-stage-filter]').forEach((button) => button.addEventListener('click', () => { stageFilter = button.dataset.stageFilter; renderProjects(); }));
      document.querySelectorAll('[data-status-filter]').forEach((button) => button.addEventListener('click', () => { statusFilter = button.dataset.statusFilter; renderProjects(); }));
      document.getElementById('project-search').addEventListener('input', (event) => { searchTerm = event.target.value; document.getElementById('project-rows').innerHTML = projectRows(filteredProjects()); });
    }

    function renderIdeas() {
      const rows = data.ideas.map((item) => `<tr>
        <td>${fileLink(item)}<div class="small">${escapeHtml(item.id)}</div></td>
        <td>${badge(item.status)}</td>
        <td>${escapeHtml(Array.isArray(item.keywords) ? item.keywords.slice(0, 3).join(', ') : item.keywords || 'Not recorded')}</td>
        <td>${dateOrMissing(item.last_activity)}</td>
        <td>${escapeHtml(item.confidence || 'Not recorded')}</td>
      </tr>`).join('') || '<tr><td colspan="5" class="empty">No idea notes with front matter were found.</td></tr>';
      document.getElementById('ideas').innerHTML = `<div class="surface"><div class="surface-header"><h2>Ideas</h2><span class="subtle">Markdown front matter records</span></div><div class="table-wrap"><table><thead><tr><th>Idea</th><th>Status</th><th>Keywords</th><th>Last activity</th><th>Confidence</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }

    function renderCoworkers() {
      const rows = data.coworkers.map((person) => {
        const workstreams = person.workstreams.map((item) => `<div><a class="table-title" href="${escapeHtml(item.path_uri)}" target="_blank" rel="noreferrer">${escapeHtml(item.title)}</a><span class="small"> · ${escapeHtml(item.kind)}</span></div>`).join('');
        return `<tr><td><strong>${escapeHtml(person.name)}</strong></td><td>${person.workstreams.length}</td><td>${workstreams}</td></tr>`;
      }).join('') || '<tr><td colspan="3" class="empty">No coworker records found. Add <code>coworkers: ["Name"]</code> to a project or idea README, or use the project manager.</td></tr>';
      document.getElementById('coworkers').innerHTML = `<div class="surface"><div class="surface-header"><h2>Coworkers</h2><span class="subtle">${data.coworkers.length} recorded people linked to research</span></div><div class="table-wrap"><table><thead><tr><th>Coworker</th><th>Linked work</th><th>Projects and ideas</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }

    function renderAttention() {
      const entries = data.attention.map((item) => `<li class="attention-item"><span class="signal warning"></span><div><div class="attention-kind">${escapeHtml(item.kind)}</div><a class="item-title" href="${escapeHtml(item.path_uri)}" target="_blank" rel="noreferrer">${escapeHtml(item.title)}</a><div class="attention-message">${escapeHtml(item.message)}</div></div></li>`).join('') || '<li class="empty">No metadata follow-up is currently flagged.</li>';
      document.getElementById('attention').innerHTML = `<div class="surface"><div class="surface-header"><h2>Attention Needed</h2><span class="subtle">No source content was inferred or changed</span></div><ul class="attention-list">${entries}</ul></div>`;
    }

    function activateView(viewName) {
      document.querySelectorAll('.tab-button').forEach((button) => button.setAttribute('aria-selected', button.dataset.view === viewName ? 'true' : 'false'));
      document.querySelectorAll('.view').forEach((view) => view.classList.toggle('active', view.id === viewName));
    }

    renderMetrics();
    renderOverview();
    renderProjects();
    renderIdeas();
    renderCoworkers();
    renderAttention();
    document.getElementById('generated-at').textContent = `Generated ${data.generated_at}`;
    document.getElementById('footer').textContent = `Source: ${data.research_root} · Rebuild with run.bat after changing research records.`;
    document.querySelectorAll('.tab-button').forEach((button) => button.addEventListener('click', () => activateView(button.dataset.view)));
  </script>

    const bytes = [];
    for (let index = 0; index < input.length; index += 1) {
      const code = input.charCodeAt(index);

    const bitLength = bytes.length * 8;

    while ((bytes.length + 8) % 64 !== 0) bytes.push(0);
    for (let shift = 56; shift >= 0; shift -= 8) bytes.push((bitLength / (2 ** shift)) & 0xff);

    const rotateRight = (value, amount) => (value >>> amount) | (value << (32 - amount));
    for (let offset = 0; offset < bytes.length; offset += 64) {
