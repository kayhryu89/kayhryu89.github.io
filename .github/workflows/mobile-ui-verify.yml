name: Mobile homepage preview verification

on:
  pull_request:
    paths:
      - "index.qmd"
      - "styles.css"
      - "scripts/**"
      - "data/**"
      - ".github/workflows/mobile-ui-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Build and validate Quarto website
        run: |
          python scripts/build_content.py
          python validate_site.py
          quarto render
      - name: Install browser for responsive layout test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify mobile CTA layout in light and dark modes
        run: python scripts/check_mobile_ui.py
      - name: Store mobile previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-home-previews
          path: _site/_screenshots/
          if-no-files-found: ignore
          retention-days: 2
